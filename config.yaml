# ── GENEL AYARLAR (kişiye özel arama profiles/ klasöründe) ──
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

schedule:
  interval_hours: 3           # her N saatte tüm profiller otomatik taranır
  min_score_to_notify: 3.0    # Telegram'a gönderme eşiği
  min_score_to_store: 1.0     # dashboard'a kaydetme eşiği
  min_relevance: 1.0          # bir ilan en az bu kadar ROL/arama-terimi uyumu içermezse alınmaz

# Tüm profillerde ORTAK puanlama (konum / çalışma şekli / seviye).
# Kişiye özel beceriler profiles/*.yaml içinden otomatik eklenir.
scoring:
  izmir: 2
  manisa: 2
  uzaktan: 2
  remote: 2
  hibrit: 1
  hybrid: 1
  "ar-ge": 1
  junior: 1
  "mid-level": 1
  senior: 1

# Tüm profillerde ORTAK eleme (her profilin kendi exclude'u buna eklenir)
filters:
  exclude_keywords:
    - "güvenlik görevlisi"
    - "temizlik görevlisi"
    - "engelli"          # engelli-kadro ilanlarını ele
    - "(engelli)"

database:
  path: "~/.job_bot/jobs.db"
