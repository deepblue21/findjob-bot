name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Testler
        run: |
          python test_dashboard_static.py
          python test_jobbot.py
